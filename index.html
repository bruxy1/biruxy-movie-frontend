<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIRUXY MOVIE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-page">

    <div class="login-box">

      <div class="logo">BIRUXY</div>
      <div class="logo-sub">MOVIE</div>

      <h1>Welcome</h1>

      <p class="login-text">
        Enter your username to continue
      </p>

      <input
        type="text"
        id="username"
        placeholder="USER-XXXXXXXX"
        autocomplete="off"
      >

      <button onclick="login()">
        LOGIN
      </button>

      <p id="message"></p>

    </div>

  </div>


  <script>

    // ACCESS API
    // ADUNLOCK isi API se USER key generate karta hai.
    const ACCESS_API =
      "https://biruxy-access-api.onrender.com";


    async function login() {

      const username =
        document
          .getElementById("username")
          .value
          .trim()
          .toUpperCase();

      const message =
        document.getElementById("message");


      if (!username) {

        message.textContent =
          "Please enter your username.";

        message.className =
          "error";

        return;
      }


      message.textContent =
        "Checking...";

      message.className = "";


      try {

        const response =
          await fetch(
            `${ACCESS_API}/api/keys/verify`,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                key: username
              })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.valid
        ) {

          message.textContent =
            data.error ||
            "Invalid username.";

          message.className =
            "error";

          return;
        }


        localStorage.setItem(
          "biruxy_username",
          username
        );


        message.textContent =
          "Login successful!";

        message.className =
          "success";


        setTimeout(() => {

          window.location.href =
            "movies.html";

        }, 700);


      } catch (error) {

        console.error(error);

        message.textContent =
          "Unable to connect to server.";

        message.className =
          "error";

      }

    }


    document
      .getElementById("username")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            login();
          }

        }
      );

  </script>

</body>
</html>
